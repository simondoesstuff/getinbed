name: Precompile NIFs

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: NIF ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-22.04, cross: true }

    steps:
      - uses: actions/checkout@v4

      # Native builds need OTP to provide erl_nif.h; cross builds use bundled headers in rustler_sys.
      - uses: erlef/setup-beam@v1
        if: "!matrix.cross"
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build -p getinbed --release --features nif --target ${{ matrix.target }}
          else
            cargo build -p getinbed --release --features nif --target ${{ matrix.target }}
          fi

      - name: List build output
        run: ls -la target/${{ matrix.target }}/release/libgetinbed* || echo "no libgetinbed files found"

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          NIF="2.16"

          [[ "$TARGET" == *darwin* ]] && SRC_EXT=dylib || SRC_EXT=so

          SRC="target/$TARGET/release/libgetinbed.$SRC_EXT"
          ARCHIVE="libgetinbed-v${VERSION}-nif-${NIF}-${TARGET}.so.tar.gz"

          cp "$SRC" libgetinbed.so
          tar -czf "$ARCHIVE" libgetinbed.so
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          token: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate checksum file
        env:
          GETINBED_BUILD: "1"
        run: |
          mix deps.get
          mix rustler_precompiled.download GetInBed --all --print > checksum-Elixir.GetInBed.exs

      - name: Open PR with updated checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/checksums-${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add checksum-Elixir.GetInBed.exs
          git diff --cached --quiet && echo "No checksum changes." && exit 0
          git commit -m "chore: update NIF checksums for ${{ github.ref_name }}"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "Update NIF checksums for ${{ github.ref_name }}" \
            --body "Automated checksum update after precompiled NIF release." \
            --base main \
            --head "$BRANCH" \
            || echo "PR already exists."
